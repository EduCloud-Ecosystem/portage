#
# scale1.example.registry.yaml — a sanitized example registry, fully
# open-weight, placeholder endpoints throughout. Renders (via
# src/portage/render_config.py) into scale1.example.yaml and
# scale1.example.model_list.yaml, both checked in so the engine's CI can
# re-render and diff them on every PR (HB-0 Step 1). This is the reviewable
# template Scale-2 deployment configs get cut against — see
# config/profiles/README.md and portage-local's own (private) registry.yaml
# for the real, machine-specific counterpart.

models:
  - alias: code_small
    provider_route: ollama_chat
    model_id: qwen3-coder:7b
    endpoint: os.environ/EXAMPLE_NODE_A_HOST
    order: 1
    open_weight: true
    license: Apache-2.0
    license_family: permissive
    max_context: 32768
    supports_tools: true
    supports_json: true
    data_classification: public
    benchmark_version: null
    bfclv3: null
    ifeval: null
    enabled: true

